{% extends 'analisis_bioquimico/base.html' %}

{% block content %}

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-md-5">

            <div class="card border-0 shadow-lg rounded-3">

                <div class="card-header bg-primary text-white text-center py-3">

                    <h4 class="fw-bold mb-0">

                        <i class="bi bi-shield-lock-fill me-2"></i>

                        Acceso al Sistema

                    </h4>

                </div>


                <div class="card-body p-4">


                    <!-- ======================================
                         PESTAÑAS
                    ======================================= -->

                    <ul
                        class="nav nav-pills nav-justified mb-4"
                        id="loginTab"
                        role="tablist"
                    >

                        <!-- PACIENTE -->

                        <li
                            class="nav-item"
                            role="presentation"
                        >

                            <button
                                class="nav-link active fw-bold"
                                id="paciente-tab"
                                data-bs-toggle="tab"
                                data-bs-target="#paciente-panel"
                                type="button"
                                role="tab"
                            >

                                <i class="bi bi-person-fill me-1"></i>

                                Paciente

                            </button>

                        </li>


                        <!-- PERSONAL -->

                        <li
                            class="nav-item"
                            role="presentation"
                        >

                            <button
                                class="nav-link fw-bold"
                                id="personal-tab"
                                data-bs-toggle="tab"
                                data-bs-target="#personal-panel"
                                type="button"
                                role="tab"
                            >

                                <i class="bi bi-person-badge-fill me-1"></i>

                                Personal

                            </button>

                        </li>

                    </ul>


                    <!-- ======================================
                         CONTENIDO DE LAS PESTAÑAS
                    ======================================= -->

                    <div
                        class="tab-content"
                        id="loginTabContent"
                    >


                        <!-- ==================================
                             PACIENTE
                        =================================== -->

                        <div
                            class="tab-pane fade show active"
                            id="paciente-panel"
                            role="tabpanel"
                        >

                            <form method="POST">

                                {% csrf_token %}


                                <div class="mb-3">

                                    <label
                                        class="form-label fw-semibold"
                                    >
                                        Número de DNI
                                    </label>

                                    <input
                                        type="text"
                                        name="dni"
                                        class="form-control"
                                        placeholder="Ej: 35123456"
                                        required
                                    >

                                </div>


                                <div class="mb-3">

                                    <label
                                        class="form-label fw-semibold"
                                    >
                                        Clave CAP
                                    </label>

                                    <input
                                        type="password"
                                        name="cap"
                                        class="form-control"
                                        placeholder="Ingrese su clave CAP"
                                        required
                                    >

                                </div>


                                <button
                                    type="submit"
                                    class="btn btn-primary w-100 fw-bold py-2 mt-2"
                                >

                                    <i class="bi bi-box-arrow-in-right me-1"></i>

                                    Consultar Mis Resultados

                                </button>

                            </form>

                        </div>


                        <!-- ==================================
                             PERSONAL
                        =================================== -->

                        <div
                            class="tab-pane fade"
                            id="personal-panel"
                            role="tabpanel"
                        >

                            <form
                                method="POST"
                                action="{% url 'analisis_bioquimico:login_personal' %}"
                            >

                                {% csrf_token %}


                                <div class="mb-3">

                                    <label
                                        class="form-label fw-semibold"
                                    >
                                        Usuario
                                    </label>

                                    <input
                                        type="text"
                                        name="username"
                                        class="form-control"
                                        placeholder="Ingrese su usuario"
                                        required
                                    >

                                </div>


                                <div class="mb-3">

                                    <label
                                        class="form-label fw-semibold"
                                    >
                                        Contraseña
                                    </label>

                                    <input
                                        type="password"
                                        name="password"
                                        class="form-control"
                                        placeholder="••••••••"
                                        required
                                    >

                                </div>


                                <button
                                    type="submit"
                                    class="btn btn-dark w-100 fw-bold py-2 mt-2"
                                >

                                    <i class="bi bi-shield-check me-1"></i>

                                    Ingresar al Panel

                                </button>

                            </form>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
