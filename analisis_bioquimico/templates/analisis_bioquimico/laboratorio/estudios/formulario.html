{% extends "analisis_bioquimico/base.html" %}

{% block content %}

<div class="container mt-4">

    <h2>{{ titulo }}</h2>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-success">
            Guardar
        </button>

        <a href="{% url 'analisis_bioquimico:estudios_lista' %}"
           class="btn btn-secondary">
            Cancelar
        </a>

    </form>

</div>

{% endblock %}
